var nextHit = document.getElementById("nextHit");

var route = document.getElementById("route");
var damage = document.getElementById("damage");
var status = document.getElementById("status");

function getMove(select) {
  return MOVES[parseInt(select.value, 10)];
}

function updateStarter() {
  var m = getMove(starter);
  starterName.textContent = m.name;
  starterDamage.textContent = m.damage + " dmg" + (hasStarterCorrection(m) ? "（次の1ヒット80%）" : "");
}

function updateNext() {
  var m = getMove(next);
  var f = m.frame || {};
  nextName.textContent = m.name;
  nextDamage.textContent = m.damage + " dmg";
  nextStartup.textContent = f.startup || "—";
  nextHit.textContent = f.onHit || "—";
}

function hasStarterCorrection(m) {
  if (!m) return false;
  return [
    "stLP", "stLK", "crLP", "crLK", "crMK", "drive_impact"
  ].indexOf(m.id) !== -1;
}

function render() {
  var first = getMove(starter);
  var total = Number(first.damage) || 0;
  var html = '<div class="route-item"><span class="route-name">1. ' +
    first.name + '</span><span class="route-dmg">' +
    first.damage + ' dmg</span></div>';

  var i, m, applied, shownDamage;
  for (i = 0; i < combo.length; i++) {
    m = MOVES[combo[i]];
    applied = 1;

    // Starter correction applies to the next hit only at this stage.
    if (i === 0 && hasStarterCorrection(first)) applied = 0.80;

    // The frame-data note specifies a 20% starter correction for Goujin
    // when it is performed directly from OD Hyakki.
    if (i === 0 && first.id === "hyakki_OD" && m.id === "hyakki_goujin") applied = 0.80;

    shownDamage = Math.floor((Number(m.damage) || 0) * applied);
    total += shownDamage;
    html += '<div class="route-item"><span class="route-name">' +
      (i + 2) + '. ' + m.name + '</span><span class="route-dmg">' +
      shownDamage + ' dmg' + (applied < 1 ? '（80%）' : '') + '</span></div>';
  }

  route.innerHTML = html;
  damage.textContent = total + " damage";
}

starter.onchange = function() {
  combo = [];
  updateStarter();
  render();
  status.textContent = "始動技を変更しました。";
};

next.onchange = function() {
  updateNext();
  status.textContent = "「" + getMove(next).name + "」を選択中。";
};

add.onclick = function() {
  var index = parseInt(next.value, 10);
  if (isNaN(index) || !MOVES[index]) return;

  combo.push(index);
  render();
  status.innerHTML = '<span class="ok">「' + MOVES[index].name +
    '」をコンボに追加しました。</span>';
};

clear.onclick = function() {
  combo = [];
  render();
  status.textContent = "コンボをクリアしました。";
};

updateStarter();
updateNext();
render();
</script>
</main>

<script>
(function () {
  // Starter correction: the first follow-up hit is 80% for these starters.
  // All later hits remain unscaled at this stage.
  const STARTER_CORRECTION_80 = new Set([
    "立ち弱P（面割り）",
    "立ち弱K",
    "しゃがみ弱P",
    "しゃがみ弱K",
    "しゃがみ中K（鉤蹴り）",
    "ドライブインパクト"
  ]);

  function correctionRateForStarter(name) {
    return STARTER_CORRECTION_80.has(name) ? 0.80 : 1.00;
  }

  // Expose a calculation helper for the existing page without replacing its UI.
  window.calculateStarterCorrectedDamage = function (combo) {
    if (!Array.isArray(combo) || combo.length === 0) return 0;
    let total = Number(combo[0].damage) || 0;
    const rate = correctionRateForStarter(combo[0].name);
    for (let i = 1; i < combo.length; i++) {
      const damage = Number(combo[i].damage) || 0;
      total += damage * (i === 1 ? rate : 1);
    }
    return Math.round(total);
  };
})();
</script>
